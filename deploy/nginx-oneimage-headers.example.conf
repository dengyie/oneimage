# Response hardening shared by every location below.
#
# `add_header` is not additive across config levels: a location that declares
# any header of its own drops everything inherited from the server block, so
# each location that sets Cache-Control re-includes this file.
#
# CSP notes for this app: the bundle is a plain same-origin ES module (no
# inline scripts, no eval), images arrive as data:/blob: URLs from the local
# editor, every network call goes to same-origin /api/, and React needs
# 'unsafe-inline' for the style attributes it writes.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
