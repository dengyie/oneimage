map $http_cf_connecting_ip $oneimage_client_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

server {
    listen 127.0.0.1:3302;
    server_name image.mangoqwq.com;
    include /personal/pxed/nginx/oneimage-secret.conf;
    root /personal/pxed/oneimage/current/dist;
    index index.html;

    # Security headers for every response. Locations that also set
    # Cache-Control must re-include the same file (add_header does not merge).
    include /personal/pxed/nginx/snippets/oneimage-headers.conf;

    location = /healthz {
        proxy_pass http://127.0.0.1:8877;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $oneimage_client_ip;
        proxy_set_header X-Forwarded-For $oneimage_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8877;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $oneimage_client_ip;
        proxy_set_header X-Forwarded-For $oneimage_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-OneImage-Token $oneimage_server_token;
        # Keep a small multipart framing margin above the app's 25 MiB file limit.
        # This lets Fastify return its JSON payload-too-large contract.
        client_max_body_size 26m;
    }

    # Vite emits content-hashed filenames, so these never change under the same
    # URL. Missing ones must 404 instead of falling through to the SPA shell:
    # a soft 200 of text/html would make a stale or mistyped asset reference
    # fail silently in the browser.
    location ^~ /assets/ {
        try_files $uri =404;
        include /personal/pxed/nginx/snippets/oneimage-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /favicon.ico {
        try_files $uri =404;
        include /personal/pxed/nginx/snippets/oneimage-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /personal/pxed/nginx/snippets/oneimage-headers.conf;
        # The shell references the current bundle names, so it must revalidate.
        add_header Cache-Control "no-cache" always;
    }
}
