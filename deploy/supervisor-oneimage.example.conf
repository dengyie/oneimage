[program:oneimage]
command=/personal/pxed/oneimage/run.sh
directory=/personal/pxed/oneimage
autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/personal/pxed/oneimage/out.log
stderr_logfile=/personal/pxed/oneimage/err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
