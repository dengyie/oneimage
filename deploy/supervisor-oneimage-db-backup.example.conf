[program:oneimage-db-backup]
command=/personal/pxed/oneimage/backup/oneimage-db-backup-loop.sh
directory=/personal/pxed/oneimage/backup
autostart=true
autorestart=true
startsecs=1
startretries=50
stopasgroup=true
killasgroup=true
stdout_logfile=/personal/pxed/backups/oneimage/backup-loop.supervisor.out.log
stderr_logfile=/personal/pxed/backups/oneimage/backup-loop.supervisor.err.log
